<!doctype html>
<html lang="en-NZ">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sky Path sounds</title>
  <style>
    :root { --bg: #f4efe6; --card: #fffaf2; --ink: #2d2620; --muted: #7a6d60; --accent: #b4532a; --line: #e2d8c8; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #17140f; --card: #221d17; --ink: #f1e8da; --muted: #a89a88; --accent: #e07a4c; --line: #3a3128; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, sans-serif; }
    main { max-width: 860px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .lead { color: var(--muted); margin: 0 0 18px; }
    .bar { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
    .card h2 { font-size: 16px; margin: 0; }
    .tag { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent); }
    .where { color: var(--muted); font-size: 13px; flex: 1; }
    .btns { display: flex; gap: 6px; }
    button { font: inherit; padding: 6px 12px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
    button.play { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.play.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
    input[type=range] { width: 160px; }
  </style>
</head>
<body>
  <main>
    <h1>Sky Path sounds</h1>
    <p class="lead">
      Previews only, nothing is in the game yet. Every sound is generated in code when it plays:
      no audio files, so they add nothing to the download. Each plays slightly differently every
      time, on purpose. “Save WAV” records 6–8 seconds to a file.
    </p>
    <div class="bar">
      <label>Volume <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8" /></label>
      <button id="stopAll">Stop all</button>
    </div>
    <div class="grid" id="grid"></div>
  </main>
  <script type="module" src="/src/sound/preview.js"></script>
</body>
</html>
